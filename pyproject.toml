[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sinai-crm-bot"
version = "2.0.0"
requires-python = ">=3.12"
dependencies = ["httpx>=0.28,<1", "aiosqlite>=0.20,<1", "pydantic-settings>=2.6,<3", "python-dotenv>=1,<2", "python-dateutil>=2.9,<3", "tzdata>=2025.1", "filelock>=3.16,<4", "vobject>=0.9.9,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "respx>=0.22,<1", "ruff>=0.11,<1"]

[project.scripts]
sinai = "sinai.cli:main"

[tool.setuptools.packages.find]
include = ["sinai*"]

[tool.setuptools.package-data]
sinai = ["migrations/*.sql"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
