services:
  bot:
    build: .
    restart: unless-stopped
    environment:
      ENV_PATH: /app/config/.env
      DATABASE_PATH: /app/data/sinai.sqlite3
    volumes:
      - ./config:/app/config
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "sinai", "health"]
      interval: 30s
      timeout: 5s
      retries: 3
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
